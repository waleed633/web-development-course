<!DOCTYPE html>
<html>
    <head>
        <title>My animal fact file</title>
        <style>

            /* Page background - sets the color and font for the whole page */
            body{
                background-color: darkgreen;
                font-family: Arial, sans-serif;
            }

            /* box model - width sets the content area
            padding pushes thte text away froem the edges
            border draws a visible frame around the fact file
            margin pushes the fact file away from the screen edge */
            .fact-file {
                background-color: lightyellow;
                color: darkslategray;
                width: 260px;
                padding: 25px;
             border:4px solidforestgreen;
             margin: 30px
            }

            /* Animal name - forestgreen so it stabd out */
            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }

            /* Details rows - dark text on the light background */
            .detail {
            color: darkslategray;
            }

            /* Cool fact - orange and italic to make it feel special */
            .cool-fact {
                color: darkorange;
                font-style: italic;
            }

        </style>
    </head>
    <body>

        <div class="fact-file">
            <h2 class="anima-name "> snow leopard</h2>
            <p class="detail">Type big cat</p>
            <p class=detal>Lives in: Mountains ranges of central Asia</p>
            <p class="detal">Diet: Deer, goats, and wild sheep</p>
            <p class="cool-fact">cool fact: can leep up to 15 neters in one jump!</p>
        </div>

    </body>
</html>
