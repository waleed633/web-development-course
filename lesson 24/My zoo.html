<!DOCTYPE html>
<html>
    <head>
        <title>My Zoo</title>
        <style>

            body {
                font-family: Arial, sans-serif;
                background: aliceblue;
                text-align: center;
                padding: 30px;
            }
            
            h1 {
                color: #ff5a43;
            }

            #zoo { 
                border: 2px solid #ff5a43;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                background: white;
            }

            .zone {
                border: 1px solid #ff5a43;
                margin: 6px 0;
                padding: 8px 12px;
                border-radius: 6px;
                text-align: left;
            }

            button {
                background: #ff5a43;
                color: white;
                padding: 10px 24px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>

        <h1>
            my zoo
        </h1>
        <p>
            Use javascript and the DOM to add animal names inside each span are text nodes.
        </p>

        <!--
        DOM tree: zoo is the root element
        zone divs are child elements nodes. Animal names inside each span are text nodes.
        -->
        <div id="zoo">
            <div class="zone">
                <span id="zone">Zone 1: <span id="Zone 1"></span></div>
            <div class="zone">Zone 2: <span id="Zone 2"></span></div>
            <div class="zone">Zone 3: <span id="Zone 3"></span></div>
            <div class="zone">Total Animals: <span id="Total"></span></div>
            </div>


        <br>

        <button onclick="openzoo()">Open Zoo</button>

        <p id="zoo-status"></p>

        <script>

            function openzoo(){

                /* Task 1 Add your first Animal to zone 1 */
                document.getElementById("Zone 1").innerHTML = "Lion";

                /* Task 2: Add your second Animal to zone 2 */
                document.getElementById("Zone 2").innerHTML = "Tiger";

                /* Task 3: Add your third Animal to zone 3 */
                document.getElementById("Zone 3").innerHTML = "Bear";

                /* Task 4: Add the total number of animals to the Total span */
                document.getElementById("Total").innerHTML = "3";

                /* Task 5: Add a message to the zoo-status paragraph */
                document.getElementById("zoo").style.background = "lightgreen";

                /* Task 6: Add a message to the zoo-status paragraph */
                document.getElementById("zoo-status").innerHTML = document.title + " is now open!";

            }
        </script>
    </body>
</html>
