<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bill Splitter</title>
        <link rel="stylesheet" href="bill_calculator.css">
    </head>
    <body>

        <div class="container">

            <h1>💰 Bill Splitter</h1>

            <label>Bill Amount ($):</label>
            <input type="number" id="bill" placeholder="Enter bill amount">

            <label>Tip percentage</label>
            <select id="tip">
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
                <option value="25">25%</option>
                </select>

                <label>Number of people</label>
                <input type="number" id="people" placeholder="Enter number of people">

                <div class="buttons">
                    <button onclick="calculate()"></button>Calculate</button>
                    <button onclick="resetFields()">Reset</button>
                </div>

                <div class="results">
                    <h3>Tip Amount: $<span id="tipAmount">0.00</span></h3>
                     <h3>Total Amount: $<span id="totalAmount">0.00</span></h3>
                     <h3>Amount per Person: $<span id="amountPerPerson">0.00</span></h3>
                </div>

                </div>

                <script src="bill_calculator.js"></script>
    </body>
</html>
