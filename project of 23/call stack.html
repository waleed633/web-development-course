<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript Functions</h2>
        <p>Functions are one of the building blocks in JavaScript. A function is a JavaScript procedure—a set of statements that performs a task or calculates a value.</p>
        <p id="demo"></p>
        <script>
            function add(a,b) {
                return a + b;
            }
            function average(a,b) {
                return (a + b) / 2;
            }
let result = average(10,20);
            document.getElementById("demo").innerHTML = result;
        </script>
    </body>
</html>
