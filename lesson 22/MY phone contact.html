<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My phone Contact</title>
    <link

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"

rel="stylesheet">
<style>
    body {background-color: #F0F0F2; }
    h1 {color: #FF5A43; }
    .card-label {font-size: 11px; color: #999; text-transform: uppercase; }
pre { font-size: 13px; color: #333; }
</style>
</head>
<body class="py-4">

    <div clas="container">

        <h1 class="mb-1">My phone contact</h1>
        <p class="text-muted mb-4">
            Introduction to object in Javascript - Grade 4-6
        </p>

        <!--contact Card-->
        <div class="card shadow-sm mb-3" style="max-width:400px;">
            <div class="card-body">
                <h5 class="card-title" style="color:#FF5A43; "> contact details</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">
                    <span class="card-label d-block">Name</span>
                    <strong id="name">-</strong>
                </li>
                <li class="list-group-item">
                    <span class="card-label d-block">phone</span>
                    <strong id="phone">-</strong>
                </li>
                <li class="list-group-item">
                    <span class="card-label d-block">School</span>
                    <strong id="school">-</strong>
                </li>  
                <li class="list-group-item">
                    <span class="card-label d-block">City</span>
                    <strong id="city">-</strong>
                </li>
            </ul>
            </div>
            </div>
            <!-- code box -->
<div class="card shadow-sm" style="max-width:400px; ">
    <div class="card-body">
        <h6 class="color:#FF5A43; ">Javasctipt object used</h5>
        <pre><code id="codeDisplay"
            class="bg-light p-3 rounded border mb-0"></pre>
</div>
</div>

</div><!-- /container-->

<script>

    // Step 1 - creat the contact object
    var contact = {
        name: "John Doe",
        phone: "+1 234 567 890",
        school: "Greenwood High School",
        city: "New York"
    };

    // step 2 - dot notation 
    var name1 = document.getElementById("name");
    var phone1 = document.getElementById("phone");
    name1.textContent = contact.name;
    phone1.textContent = contact.phone;

    // step3 - bracket notation
    var school1 = document.getElementById("school");
    var city1 = document.getElementById("city");
    school1.textContent = contact["school"];
    city1.textContent = contact["city"];
    // show the object in the box
    var codeE1 = document.getElementById("codeDisplay");
    codeE1.textcontenet =
    'var my contact = {\n' +
    'name : "John Doe",\n' +
    'phone : "+1 234 567 890",\n' +
    'school : "Greenwood High School",\n' +
    'city : "New York"\n' +
    '};'
</script>
</body>
